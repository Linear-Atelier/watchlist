<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8f1c21"/>
      <stop offset="100%" stop-color="#4f0a0d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3cf"/>
      <stop offset="50%" stop-color="#d9a94e"/>
      <stop offset="100%" stop-color="#b07a22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular Crimson Base with Golden Border -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#gold)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#f7b9c9" stroke-width="0.8" opacity="0.4" stroke-dasharray="2,2"/>

  <!-- Christmas Tree Layers -->
  <g filter="url(#glow)">
    <!-- Trunk -->
    <rect x="29" y="47" width="6" height="6" rx="1" fill="#4a2810"/>
    
    <!-- Bottom tier -->
    <path d="M16 48 L48 48 L39 37 L44 37 L35 27 L32 27 L29 27 L20 37 L25 37 Z" fill="#1f5a3c"/>
    <path d="M19 46 L45 46 L38 38 L43 38 L34 29 L32 29 L30 29 L21 38 L26 38 Z" fill="#2d7a52" opacity="0.75"/>

    <!-- Snow tipped edges -->
    <path d="M16 48 C 22 46, 26 49, 32 46 C 38 49, 42 46, 48 48 L 45 44 C 40 45, 36 43, 32 44 C 28 43, 24 45, 19 44 Z" fill="#fff7ef" opacity="0.9"/>
    <path d="M20 37 C 24 35.5, 28 37.5, 32 35.5 C 36 37.5, 40 35.5, 44 37 L 41 34 C 38 35, 35 34, 32 34.5 C 29 34, 26 35, 23 34 Z" fill="#fff7ef" opacity="0.9"/>

    <!-- Golden Star on Top -->
    <polygon points="32,10 34.5,17 42,17.5 36,22 38.5,29 32,24.5 25.5,29 28,22 22,17.5 29.5,17" fill="url(#gold)" stroke="#fff" stroke-width="0.5"/>
    
    <!-- Mini Ornaments -->
    <circle cx="27" cy="42" r="1.8" fill="#d7142f"/>
    <circle cx="37" cy="43" r="1.8" fill="url(#gold)"/>
    <circle cx="32" cy="38" r="1.8" fill="#f7b9c9"/>
    <circle cx="28" cy="32" r="1.5" fill="url(#gold)"/>
    <circle cx="36" cy="33" r="1.5" fill="#d7142f"/>
  </g>
</svg>
